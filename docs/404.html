<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Gumption Trap Analyzer</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages (spa-github-pages)
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body>
    <h1>404 — Page not found</h1>
    <p>If you see this, your browser does not support JavaScript or the redirect failed. You can still visit the <a href="/Project-Loki/">home page</a>.</p>
  </body>
</html>
